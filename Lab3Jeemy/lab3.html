<!DOCTYPE html>
<html>
<head>
    <title>Interactive Contact Form</title>
</head>

<body>

    <!-- Header div -->
    <div>
        <h1>An interactive contact form</h1>
        <span>with an inline calculator</span>
    </div>

    <!-- Contact Form div -->
    <div>
        <h2>Contact Form</h2>

        <form>
            <label>Email:</label>
            <input type="email" name="email">
            <br><br>

            <label>Preferred Contact Date:</label>
            <input type="date" name="date">
            <br><br>

            <label>Satisfaction Level:</label>
            <input type="range" name="satisfaction"
                   min="1" max="10">
            <br><br>

            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- Calculator div -->
    <div>
        <h2>Calculator</h2>

        <label>First Number:</label>
        <input type="number" name="number1">
        <br><br>

        <label>Second Number:</label>
        <input type="number" name="number2">
        <br><br>

        <label>Sum:</label>
        <output> </output>
    </div>

    <!-- Footer div -->
    <div>
        <h2>Contact Information</h2>

        <p>Email: contact@example.com</p>
        <p>Phone: 012-3456789</p>
        <p>&copy; 2026 My Website</p>
    </div>

</body>
</html>
