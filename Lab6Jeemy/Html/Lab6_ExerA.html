<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <!-- Link external CSS file -->
    <link rel="stylesheet" href="ExerA.css">
</head>
<body>
    <!--Header section with title and instructions-->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <main>
        <!--Player section for entering name and starting the game-->
        <section class="player-section">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

        <!--Game section with choice buttons and images-->
        <section class="game-section">
            <div class="choice-buttons">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="battle-arena">
                <div class="fighter">
                    <p>You</p>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                </div>
                <span class="vs">VS</span>
                <div class="fighter">
                    <p>Computer</p>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

        <!--Result and Scoreboard section-->
        <section class="result-section">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <strong id="wins">0</strong></span>
                <span>Losses: <strong id="losses">0</strong></span>
                <span>Draws: <strong id="draws">0</strong></span>
            </div>
        </section>

        <!--History section with table and control buttons-->
        <section class="history-section">
            <h3>History</h3>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>

            <div class="action-buttons">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="summaryText"></p>
        </section>
    </main>

    <!--Footer section displaying start time and copyright-->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link external JavaScript file -->
    <script src="ExerA.js"></script>
</body>
</html>
